name: Deploy IstraArt to RU VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istraart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ISTRAART_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ISTRAART_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # Accept both full known_hosts lines and "ssh-ed25519 AAAA..." values.
          # The key itself comes only from the pinned secret, never from the network.
          host_key=$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk '{
            for (i = 1; i < NF; i++)
              if ($i == "ssh-ed25519") { print $(i+1); exit }
          }')
          if ! printf '%s' "$host_key" | grep -Eq '^[A-Za-z0-9+/]+={0,2}
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update site, build and restart
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@46.23.98.232 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/istraart
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment aborted: working tree is not clean"
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          pnpm install --frozen-lockfile
          pnpm build
          sudo -n /usr/bin/systemctl restart istraart.service
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo "IstraArt deployed successfully"
          REMOTE
; then
            echo "Invalid known_hosts secret: expected an ssh-ed25519 public key"
            exit 1
          fi
          printf '46.23.98.232 ssh-ed25519 %s\n' "$host_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update site, build and restart
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@46.23.98.232 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/istraart
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment aborted: working tree is not clean"
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          pnpm install --frozen-lockfile
          pnpm build
          sudo -n /usr/bin/systemctl restart istraart.service
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo "IstraArt deployed successfully"
          REMOTE

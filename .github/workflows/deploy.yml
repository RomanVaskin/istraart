name: Deploy IstraArt to RU VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istraart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ISTRAART_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ISTRAART_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          host_key=$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk '$1 == "ssh-ed25519" {print $2; exit} $2 == "ssh-ed25519" {print $3; exit}')
          if [ -z "$host_key" ]; then
            echo 'Host key secret must contain an ssh-ed25519 public key'
            exit 1
          fi
          printf '46.23.98.232 ssh-ed25519 %s\n' "$host_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update site, build and restart
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@46.23.98.232 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/istraart
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Deployment aborted: working tree is not clean'
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          pnpm install --frozen-lockfile
          pnpm build
          sudo -n /usr/bin/systemctl restart istraart.service
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo 'IstraArt deployed successfully'
          REMOTE

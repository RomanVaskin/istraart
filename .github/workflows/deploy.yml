name: Deploy IstraArt to RU VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istraart-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate catalog secrets
        env:
          OLNOO_CATALOG_TOKEN: ${{ secrets.OLNOO_CATALOG_TOKEN }}
          OLNOO_CATALOG_BASIC_AUTH: ${{ secrets.OLNOO_CATALOG_BASIC_AUTH }}
        run: |
          set -euo pipefail
          node scripts/catalog-deploy-env.mjs > /dev/null

      - name: Set up SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ISTRAART_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ISTRAART_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          host_key=$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk '$1 == "ssh-ed25519" {print $2; exit} $2 == "ssh-ed25519" {print $3; exit}')
          if [ -z "$host_key" ]; then
            echo 'Host key secret must contain an ssh-ed25519 public key'
            exit 1
          fi
          printf '46.23.98.232 ssh-ed25519 %s\n' "$host_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deliver catalog environment
        env:
          OLNOO_CATALOG_TOKEN: ${{ secrets.OLNOO_CATALOG_TOKEN }}
          OLNOO_CATALOG_BASIC_AUTH: ${{ secrets.OLNOO_CATALOG_BASIC_AUTH }}
        run: |
          set -euo pipefail
          umask 077
          payload=$(mktemp)
          trap 'rm -f "$payload"' EXIT
          node scripts/catalog-deploy-env.mjs > "$payload"
          remote_script=$(cat <<'REMOTE_CATALOG'
          set -eu
          command -v setfacl >/dev/null 2>&1 && command -v getfacl >/dev/null 2>&1 || {
            echo 'Catalog delivery requires setfacl/getfacl; previous environment was kept' >&2
            exit 1
          }
          id -u www-data >/dev/null
          umask 077
          tmp=$(mktemp .env.catalog.json.XXXXXX)
          trap 'rm -f "$tmp"' EXIT HUP INT TERM
          cat > "$tmp"
          node -e 'try { const x = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (!x || Object.keys(x).sort().join(",") !== "OLNOO_CATALOG_BASIC_AUTH,OLNOO_CATALOG_TOKEN,OLNOO_CATALOG_URL" || x.OLNOO_CATALOG_URL !== "https://admin.olnoo.com" || typeof x.OLNOO_CATALOG_TOKEN !== "string" || typeof x.OLNOO_CATALOG_BASIC_AUTH !== "string") process.exit(1); } catch { process.exit(1); }' "$tmp"
          # Replace inherited ACLs: only deploy (owner) may write; only www-data may read.
          setfacl --set='u::rw-,u:www-data:r--,g::---,m::r--,o::---' "$tmp"
          expected_acl=$(printf 'user::rw-\nuser:www-data:r--\ngroup::---\nmask::r--\nother::---\n')
          if [ "$(getfacl --omit-header --absolute-names "$tmp")" != "$expected_acl" ]; then
            echo 'Catalog runtime access verification failed; previous environment was kept' >&2
            exit 1
          fi
          mv -f -- "$tmp" .env.catalog.json
          trap - EXIT HUP INT TERM
          echo 'Catalog environment delivered'
          REMOTE_CATALOG
          )
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@46.23.98.232 "cd /opt/istraart && $remote_script" < "$payload"

      - name: Update site, build and restart
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 deploy@46.23.98.232 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/istraart
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Deployment aborted: working tree is not clean'
            exit 1
          fi
          git fetch origin main
          git merge --ff-only origin/main
          pnpm install --frozen-lockfile
          pnpm build
          sudo -n /usr/bin/systemctl restart istraart.service
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo 'IstraArt deployed successfully'
          REMOTE
